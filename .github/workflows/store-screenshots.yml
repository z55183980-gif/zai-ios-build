name: Capture App Store screenshots
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Released private source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 35
    environment: appstore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: z55183980-gif/zai-ios
          ref: ${{ inputs.source_sha }}
          path: private-source
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: |
            /ios/
            /scripts/
          sparse-checkout-cone-mode: false
          show-progress: false
      - name: Capture native screens without changing the release build
        env:
          REVIEW_JSON: ${{ secrets.STORE_SCREENSHOT_REVIEW_JSON }}
        run: python3 .github/scripts/capture_store.py
      - name: Save screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-store-screenshots
          path: store-screenshots
          if-no-files-found: error
          retention-days: 3
      - name: Encrypt capture diagnostics
        if: failure()
        env:
          PUBLIC_CERT: ${{ vars.DIAGNOSTICS_PUBLIC_CERT }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PUBLIC_CERT" > "$RUNNER_TEMP/capture-cert.pem"
          openssl smime -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/store-capture.log" -out "$RUNNER_TEMP/store-capture.enc" -outform DER "$RUNNER_TEMP/capture-cert.pem"
      - name: Save encrypted diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-store-diagnostics
          path: ${{ runner.temp }}/store-capture.enc
          if-no-files-found: ignore
          retention-days: 1
      - name: Clear temporary account and source files
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source" "$RUNNER_TEMP/store-derived"
          rm -f "$RUNNER_TEMP/store-capture.log" "$RUNNER_TEMP/capture-cert.pem"
